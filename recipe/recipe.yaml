schema_version: 1

context:
  name: google-cloud-monitoring
  version: "2.32.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/google_cloud_monitoring-${{ version }}.tar.gz
  sha256: 507501ce1c39161c071754f7ed14cd527788b4ea44a1d052bd815c115a70ea48

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core-grpc >=2.28.0,<3.0.0
    - google-auth >=2.14.1,<3.0.0,!=2.24.0,!=2.25.0
    # tightest of upstream's floors (python >=3.14)
    - grpcio >=1.75.1,<2.0.0
    - proto-plus >=1.26.1,<2.0.0
    - protobuf >=6.33.5,<8.0.0

tests:
  - python:
      imports:
        - google.cloud.monitoring
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  summary: Google Cloud Monitoring API client library
  license: Apache-2.0
  license_file: LICENSE
  description: Python idiomatic client for Google Stackdriver Monitoring
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-monitoring
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-monitoring
  documentation: https://googleapis.dev/python/monitoring/latest/index.html

extra:
  recipe-maintainers:
    - parthea
    - xylar
